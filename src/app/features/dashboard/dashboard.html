<div class="space-y-8 pb-16">
  <!-- Header -->
  <header class="mb-4">
    <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight">
      Resumen de la Tienda
    </h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1.5 font-medium">
      Bienvenido de nuevo. Esto es lo que está pasando en tu tienda hoy.
    </p>
  </header>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <app-stat-card
      label="Ventas Totales"
      [value]="revenueTotal() | currency"
      [trend]="{ value: revenueTrend() }"
      iconBgClass="bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 dark:border-emerald-500/10"
    >
      <svg
        icon
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
    </app-stat-card>

    <app-stat-card
      label="Órdenes Totales"
      [value]="ordersTotal() | number"
      [trend]="{ value: ordersTrend() }"
      iconBgClass="bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-500/20 dark:border-indigo-500/10"
    >
      <svg
        icon
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
        />
      </svg>
    </app-stat-card>

    <app-stat-card
      label="Valor Promedio"
      [value]="avgOrderValue() | currency"
      [trend]="{ value: avgOrderTrend() }"
      iconBgClass="bg-violet-500/10 text-violet-600 dark:text-violet-400 border border-violet-500/20 dark:border-violet-500/10"
    >
      <svg
        icon
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
        />
      </svg>
    </app-stat-card>

    <app-stat-card
      label="Nuevos Clientes"
      [value]="customersTotal() | number"
      [trend]="{ value: customersTrend() }"
      iconBgClass="bg-sky-500/10 text-sky-600 dark:text-sky-400 border border-sky-500/20 dark:border-sky-500/10"
    >
      <svg
        icon
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
        />
      </svg>
    </app-stat-card>
  </div>

  <!-- Row 2: Charts -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-8">
      <app-sales-chart [series]="salesSeries()" />
    </div>
    <div class="lg:col-span-4">
      <app-category-chart [series]="categorySeries()" [labels]="categoryLabels()" />
    </div>
  </div>

  <!-- Row 3: Banner & Top Products -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-8">
      <!-- Upgrade Banner -->
      <div
        class="relative h-full overflow-hidden rounded-3xl bg-gradient-to-br from-[#5D5FEF] to-[#4849DA] p-8 md:p-10 text-white shadow-lg hover:shadow-xl hover:shadow-indigo-500/10 transition-all duration-300 group"
      >
        <!-- Abstract Glow Decos -->
        <div class="promo-glow w-64 h-64 -top-20 -right-20 pointer-events-none opacity-40"></div>
        <div class="promo-glow w-48 h-48 -bottom-10 -left-10 pointer-events-none opacity-20"></div>

        <div class="relative z-10 max-w-xl flex flex-col justify-between h-full">
          <div>
            <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white">
              Escala tu negocio con Venti Shop Plus
            </h2>
            <p class="mt-3.5 text-indigo-100/90 text-xs md:text-sm leading-relaxed font-medium">
              Desbloquea analíticas avanzadas, personalización de checkout y soporte dedicado 24/7.
              Aumenta tus ingresos hasta un 25% con nuestras herramientas de optimización.
            </p>
          </div>
          <div class="mt-8 flex flex-wrap gap-4">
            <button
              class="px-6 py-3 bg-white text-indigo-600 font-bold rounded-xl hover:shadow-lg hover:shadow-white/10 active:scale-[0.97] transition-all hover:bg-slate-50 duration-200 cursor-pointer"
            >
              Mejorar ahora
            </button>
            <button
              class="px-6 py-3 bg-white/10 text-white border border-white/20 font-bold rounded-xl backdrop-blur-xs hover:bg-white/15 active:scale-[0.97] transition-all duration-200 cursor-pointer"
            >
              Saber más
            </button>
          </div>
        </div>

        <!-- Decoration SVG -->
        <div
          class="absolute right-[-5%] bottom-[-15%] opacity-15 pointer-events-none transform rotate-12 group-hover:rotate-[16deg] group-hover:scale-105 transition-transform duration-500"
        >
          <svg width="300" height="300" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path
              fill="#FFFFFF"
              d="M44.7,-76.4C58.8,-69.2,71.8,-59.1,79.6,-45.8C87.4,-32.5,90.1,-16.3,88.5,-0.9C86.9,14.5,81.1,29.1,72.4,41.9C63.7,54.7,52.2,65.8,38.5,72.4C24.8,79.1,8.9,81.3,-6.4,79.2C-21.7,77.2,-36.3,70.9,-48.7,61.8C-61.1,52.7,-71.4,40.8,-76.3,27.1C-81.2,13.3,-80.7,-2.3,-77.2,-17C-73.7,-31.6,-67.2,-45.3,-56.3,-53.8C-45.4,-62.3,-30.1,-65.6,-16,-72.8C-1.9,-80,14.5,-91.1,30.6,-83.6C46.7,-76.1,44.7,-76.4,44.7,-76.4Z"
              transform="translate(100 100)"
            />
          </svg>
        </div>
      </div>
    </div>
    <div class="lg:col-span-4">
      <app-top-products [products]="topProducts()" />
    </div>
  </div>

  <!-- Row 4: Full-width Table -->
  <app-recent-transactions [transactions]="recentTransactions()" />
</div>
