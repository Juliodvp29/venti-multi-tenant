<div class="w-full text-center mb-10">
    <h1 class="text-4xl sm:text-5xl font-extrabold text-white tracking-tight mb-3">
        Iniciar Sesión
    </h1>
    <p class="text-sm text-gray-400">
        Ingresa tus credenciales para gestionar tu tienda
    </p>
</div>

<!-- Error Alert -->
@if (errorMessage()) {
<div class="alert flex items-center gap-3 px-4 py-3 rounded-xl mb-6 bg-red-950/40 text-red-400 border border-red-900/50 text-xs font-semibold">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
        class="w-4 h-4 flex-shrink-0">
        <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
    </svg>
    <span>{{ errorMessage() }}</span>
</div>
}

<!-- Form -->
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-8">

    <!-- Email Field -->
    <div class="flex flex-col gap-2">
        <label for="email" class="text-[11px] font-bold uppercase tracking-widest text-gray-400">
            Correo Electrónico
        </label>
        <div class="relative flex items-center border-b border-gray-700 focus-within:border-sky-500 transition-colors duration-200 pb-1">
            <div class="absolute left-0 flex items-center pointer-events-none text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                </svg>
            </div>
            <input id="email" type="email" formControlName="email"
                class="w-full pl-8 pr-3 py-2 text-sm text-white bg-transparent border-0 outline-none ring-0 placeholder:text-gray-600"
                placeholder="tu@email.com" autocomplete="email" />
        </div>
        @if (emailError()) {
        <p class="text-xs text-red-500 mt-0.5">{{ emailError() }}</p>
        }
    </div>

    <!-- Password Field -->
    <div class="flex flex-col gap-2">
        <div class="flex items-center justify-between">
            <label for="password" class="text-[11px] font-bold uppercase tracking-widest text-gray-400">
                Contraseña
            </label>
            <a routerLink="/auth/forgot-password"
                class="text-xs font-semibold text-sky-400 hover:text-sky-300 transition-colors">
                ¿Olvidaste tu contraseña?
            </a>
        </div>
        <div class="relative flex items-center border-b border-gray-700 focus-within:border-sky-500 transition-colors duration-200 pb-1">
            <div class="absolute left-0 flex items-center pointer-events-none text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
            </div>
            <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
                class="w-full pl-8 pr-10 py-2 text-sm text-white bg-transparent border-0 outline-none ring-0 placeholder:text-gray-600"
                placeholder="••••••••" autocomplete="current-password" />
            <button type="button"
                class="absolute right-0 p-1 flex items-center justify-center text-gray-500 hover:text-gray-300 transition-colors"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                @if (showPassword()) {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
                } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                    stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                }
            </button>
        </div>
        @if (passwordError()) {
        <p class="text-xs text-red-500 mt-0.5">{{ passwordError() }}</p>
        }
    </div>

    <!-- Submit Button -->
    <div class="pt-2">
        <button type="submit"
            class="w-full py-4 px-6 text-sm font-bold text-white bg-sky-500 hover:bg-sky-400 active:bg-sky-600 rounded-2xl shadow-lg shadow-sky-500/20 transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-3"
            [disabled]="isLoading()">
            @if (isLoading()) {
            <svg class="spinner w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <span>Iniciando sesión...</span>
            } @else {
            <span>Iniciar Sesión</span>
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
            }
        </button>
    </div>
</form>

<!-- Footer link -->
<div class="mt-10 text-center">
    <p class="text-xs text-gray-500">
        ¿No tienes una tienda todavía?
        <a routerLink="/home" class="text-sky-400 font-semibold hover:text-sky-300 transition-colors ml-1">
            Conoce nuestros planes
        </a>
    </p>
</div>
