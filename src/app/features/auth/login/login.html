<div
    class="bg-white dark:bg-gray-900/95 backdrop-blur-xl rounded-3xl p-8 sm:p-10 w-full border border-gray-100 dark:border-gray-800 shadow-2xl shadow-gray-200/50 dark:shadow-black/60 transition-all">
    
    <!-- Header -->
    <div class="mb-8 text-center">
        <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-gray-900 dark:text-white">
            Iniciar Sesión
        </h2>
        <p class="mt-2 text-xs sm:text-sm text-gray-500 dark:text-gray-400 font-medium">
            Ingresa tus credenciales para gestionar tu tienda
        </p>
    </div>

    <!-- Error Alert -->
    @if (errorMessage()) {
    <div
        class="alert flex items-center gap-3 p-4 rounded-2xl mb-6 bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-400 border border-red-200/80 dark:border-red-900/40 text-xs font-semibold">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"
            class="w-5 h-5 flex-shrink-0 text-red-500">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
        <span>{{ errorMessage() }}</span>
    </div>
    }

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        <!-- Email Field -->
        <div class="flex flex-col gap-1.5">
            <label for="email" class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400 pl-0.5">
                Correo Electrónico
            </label>
            <div class="relative flex items-center">
                <div class="absolute left-3.5 flex items-center pointer-events-none z-10 text-gray-400 dark:text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                    </svg>
                </div>
                <input id="email" type="email" formControlName="email"
                    class="w-full pl-11 pr-4 py-3.5 text-sm font-medium text-gray-900 dark:text-white bg-gray-50 dark:bg-gray-800/60 border border-gray-200/80 dark:border-gray-700/60 rounded-xl transition-all duration-200 outline-none hover:border-gray-300 dark:hover:border-gray-600 focus:border-sky-500 focus:bg-white dark:focus:bg-gray-800 focus:ring-4 focus:ring-sky-500/10 placeholder:text-gray-400 dark:placeholder:text-gray-500"
                    placeholder="tu@email.com" autocomplete="email" />
            </div>
            @if (emailError()) {
            <p class="alert text-xs font-semibold text-red-600 dark:text-red-400 mt-1 pl-0.5">{{ emailError() }}</p>
            }
        </div>

        <!-- Password Field -->
        <div class="flex flex-col gap-1.5">
            <div class="flex items-center justify-between pl-0.5">
                <label for="password" class="text-[11px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">
                    Contraseña
                </label>
                <a routerLink="/auth/forgot-password"
                    class="text-xs font-semibold text-sky-600 dark:text-sky-400 hover:text-sky-700 dark:hover:text-sky-300 transition-colors">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>
            <div class="relative flex items-center">
                <div class="absolute left-3.5 flex items-center pointer-events-none z-10 text-gray-400 dark:text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                        stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                    </svg>
                </div>
                <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
                    class="w-full pl-11 pr-11 py-3.5 text-sm font-medium text-gray-900 dark:text-white bg-gray-50 dark:bg-gray-800/60 border border-gray-200/80 dark:border-gray-700/60 rounded-xl transition-all duration-200 outline-none hover:border-gray-300 dark:hover:border-gray-600 focus:border-sky-500 focus:bg-white dark:focus:bg-gray-800 focus:ring-4 focus:ring-sky-500/10 placeholder:text-gray-400 dark:placeholder:text-gray-500"
                    placeholder="••••••••" autocomplete="current-password" />
                <button type="button"
                    class="absolute right-3 p-1.5 flex items-center justify-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-200/50 dark:hover:bg-gray-700/50 rounded-lg transition-colors"
                    (click)="togglePasswordVisibility()"
                    [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                    @if (showPassword()) {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                        stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                    </svg>
                    } @else {
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                        stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                    }
                </button>
            </div>
            @if (passwordError()) {
            <p class="alert text-xs font-semibold text-red-600 dark:text-red-400 mt-1 pl-0.5">{{ passwordError() }}</p>
            }
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
            <button type="submit"
                class="w-full py-3.5 px-6 text-sm font-bold text-white bg-sky-600 hover:bg-sky-500 active:bg-sky-700 rounded-xl shadow-lg shadow-sky-600/25 hover:shadow-sky-600/35 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:shadow-none flex items-center justify-center gap-2.5"
                [disabled]="isLoading()">
                @if (isLoading()) {
                <svg class="spinner w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <span>Iniciando sesión...</span>
                } @else {
                <span>Iniciar Sesión</span>
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                </svg>
                }
            </button>
        </div>
    </form>

    <!-- Footer link -->
    <div class="mt-8 pt-6 border-t border-gray-100 dark:border-gray-800 text-center">
        <p class="text-xs text-gray-500 dark:text-gray-400 font-medium">
            ¿No tienes una tienda todavía?
            <a routerLink="/home" class="text-sky-600 dark:text-sky-400 font-bold hover:underline ml-1">
                Conoce nuestros planes
            </a>
        </p>
    </div>

</div>
